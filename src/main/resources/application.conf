akka.javasdk.agent {
  # Which model backs the four agents. Override with MODEL_PROVIDER to use any of the
  # sections below without editing this file.
  model-provider = openai
  model-provider = ${?MODEL_PROVIDER}

  # MODEL_NAME overrides the model for whichever provider is selected, so switching model
  # and switching provider are two independent decisions.
  #
  # Each provider also has a `-small` twin. Three of the four agents use the main model;
  # attribute hydration uses the small one, matching the source system, which asks for a
  # reduced model at exactly the call sites that write summaries and infer timestamps.
  # SMALL_MODEL_NAME overrides it the same way MODEL_NAME overrides the main model.

  openai {
    provider = "openai"
    api-key = ${?OPENAI_API_KEY}
    # The source system's own defaults, read from its client configuration and then confirmed
    # by constructing its client and printing what it resolved.
    model-name = "gpt-5.5"
    model-name = ${?MODEL_NAME}
    max-completion-tokens = 16384
    response-timeout = 2m
  }

  anthropic {
    provider = "anthropic"
    api-key = ${?ANTHROPIC_API_KEY}
    model-name = "claude-sonnet-5"
    model-name = ${?MODEL_NAME}
    response-timeout = 2m
  }

  googleai-gemini {
    provider = "googleai-gemini"
    api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    model-name = "gemini-2.5-flash"
    model-name = ${?MODEL_NAME}
    response-timeout = 2m
  }

  mistral-ai {
    provider = "mistral-ai"
    api-key = ${?MISTRAL_AI_API_KEY}
    # No default: set MODEL_NAME to a model this account can reach.
    model-name = ${?MODEL_NAME}
    response-timeout = 2m
  }

  # The providers below need more than a key. The SDK reads only the api-key from the
  # environment, so the remaining fields get env fallbacks defined here.

  vertex-ai {
    provider = "vertex-ai"
    api-key = ${?VERTEX_AI_API_KEY}
    project-id = ${?VERTEX_AI_PROJECT_ID}
    location = ${?VERTEX_AI_LOCATION}
    model-name = ${?MODEL_NAME}
  }

  azure-openai {
    provider = "azure-openai"
    api-key = ${?AZURE_OPENAI_API_KEY}
    endpoint = ${?AZURE_OPENAI_ENDPOINT}
    deployment-name = ${?AZURE_OPENAI_DEPLOYMENT}
  }

  bedrock {
    provider = "bedrock"
    region = ${?AWS_REGION}
    model-id = ${?BEDROCK_MODEL_ID}
  }

  hugging-face {
    provider = "hugging-face"
    access-token = ${?HUGGING_FACE_ACCESS_TOKEN}
    model-id = ${?HUGGING_FACE_MODEL_ID}
  }

  # Local models need no key, only a reachable address.

  ollama {
    provider = "ollama"
    base-url = ${?OLLAMA_BASE_URL}
    model-name = ${?MODEL_NAME}
  }

  local-ai {
    provider = "local-ai"
    base-url = ${?LOCAL_AI_BASE_URL}
    model-name = ${?MODEL_NAME}
  }
}

# The reduced model, one twin per provider. Each inherits everything from its provider and
# changes only the model name, so a key set once serves both.

akka.javasdk.agent.openai-small = ${akka.javasdk.agent.openai}
akka.javasdk.agent.openai-small {
  model-name = "gpt-4.1-nano"
  model-name = ${?SMALL_MODEL_NAME}
  temperature = 1
  max-tokens = 16384
  max-completion-tokens = -1
}

akka.javasdk.agent.anthropic-small = ${akka.javasdk.agent.anthropic}
akka.javasdk.agent.anthropic-small {
  model-name = "claude-haiku-4-5"
  model-name = ${?SMALL_MODEL_NAME}
}

akka.javasdk.agent.googleai-gemini-small = ${akka.javasdk.agent.googleai-gemini}
akka.javasdk.agent.googleai-gemini-small {
  model-name = "gemini-2.5-flash-lite"
  model-name = ${?SMALL_MODEL_NAME}
}

akka.javasdk.agent.mistral-ai-small = ${akka.javasdk.agent.mistral-ai}
akka.javasdk.agent.mistral-ai-small {
  model-name = ${?SMALL_MODEL_NAME}
}

akka.javasdk.agent.vertex-ai-small = ${akka.javasdk.agent.vertex-ai}
akka.javasdk.agent.vertex-ai-small {
  model-name = ${?SMALL_MODEL_NAME}
}

akka.javasdk.agent.azure-openai-small = ${akka.javasdk.agent.azure-openai}
akka.javasdk.agent.azure-openai-small {
  deployment-name = ${?AZURE_OPENAI_SMALL_DEPLOYMENT}
}

akka.javasdk.agent.bedrock-small = ${akka.javasdk.agent.bedrock}
akka.javasdk.agent.bedrock-small {
  model-id = ${?BEDROCK_SMALL_MODEL_ID}
}

akka.javasdk.agent.hugging-face-small = ${akka.javasdk.agent.hugging-face}
akka.javasdk.agent.hugging-face-small {
  model-id = ${?HUGGING_FACE_SMALL_MODEL_ID}
}

akka.javasdk.agent.ollama-small = ${akka.javasdk.agent.ollama}
akka.javasdk.agent.ollama-small {
  model-name = ${?SMALL_MODEL_NAME}
}

akka.javasdk.agent.local-ai-small = ${akka.javasdk.agent.local-ai}
akka.javasdk.agent.local-ai-small {
  model-name = ${?SMALL_MODEL_NAME}
}

# Turning text into the numbers used for similarity search. This is a separate account from
# the one above and stays separate: several providers that serve chat models — Anthropic and
# Bedrock among them — do not offer embeddings at all, so tying the two together would make
# choosing a chat provider silently decide whether search works.
#
# Any endpoint speaking the OpenAI embeddings shape will do, which includes Azure OpenAI,
# LocalAI, Ollama and most gateways. Model and width are the source system's; both matter,
# because a different model puts the same sentence somewhere else and a different width is a
# different space entirely.
memory.embedding {
  base-url = "https://api.openai.com"
  base-url = ${?EMBEDDING_BASE_URL}
  api-key = ""
  api-key = ${?OPENAI_API_KEY}
  api-key = ${?EMBEDDING_API_KEY}
  model-name = "text-embedding-3-small"
  model-name = ${?EMBEDDING_MODEL_NAME}
  dimensions = 1024
  dimensions = ${?EMBEDDING_DIMENSIONS}
}

# Optional authentication. Empty means off, which is the default and what keeps a default build
# caller-compatible with the source system. Setting it is a deliberate divergence (D-008).
memory.auth {
  token = ""
  token = ${?MEMORY_AUTH_TOKEN}
}

# The graph, vector and full-text store. Reached over HTTP, so there is nothing to configure
# beyond where it is and which ledger to write to.
memory.store {
  base-url = "http://127.0.0.1:8090"
  base-url = ${?MEMORY_STORE_URL}
  ledger = "memory"
  ledger = ${?MEMORY_STORE_LEDGER}
}
