# Model configuration.
#
# The values are the source system's own defaults, read from its client configuration and then
# confirmed by constructing its client and printing what it resolved:
#
#   temperature = 1        (its LLMConfig default; the constant named DEFAULT_TEMPERATURE = 0 in
#                           its client module is never referenced and does not apply)
#   medium model = gpt-5.5
#   small model  = gpt-4.1-nano
#   max tokens   = 16384
#
# Three of the four agents run on the medium model, one on the small model — matching which of the
# source's call sites pass a reduced model size. See AttributeHydrationAgent, which selects
# `openai-small` explicitly; every other agent inherits the default below.
#
# Temperature is set here but the medium model will ignore it: the source omits temperature for
# every model whose name begins gpt-5, o1 or o3, because those reject it. Leaving the value
# configured keeps it correct for whoever points the default at a non-reasoning model.

akka.javasdk {
  agent {
    model-provider = openai

    openai {
      model-name = "gpt-5.5"
      api-key = ${?OPENAI_API_KEY}
      max-completion-tokens = 16384
      response-timeout = 2m
    }
  }
}

# Optional authentication. Empty means off, which is the default and what keeps a default build
# caller-compatible with the source system. Setting it is a deliberate divergence (D-008).
memory.auth {
  token = ""
  token = ${?MEMORY_AUTH_TOKEN}
}

# The graph, vector and full-text store. Reached over HTTP, so there is nothing to configure
# beyond where it is and which ledger to write to.
memory.store {
  base-url = "http://127.0.0.1:8090"
  base-url = ${?MEMORY_STORE_URL}
  ledger = "memory"
  ledger = ${?MEMORY_STORE_LEDGER}
}

# The reduced model, referenced by name from the one agent that uses it.
akka.javasdk.agent.openai-small = ${akka.javasdk.agent.openai}
akka.javasdk.agent.openai-small {
  model-name = "gpt-4.1-nano"
  temperature = 1
  max-tokens = 16384
  max-completion-tokens = -1
}
